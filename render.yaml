services:
  - type: web
    name: autonomous-logistics-agent
    runtime: python
    plan: free
    buildCommand: pip install -e . && python main.py db
    startCommand: python main.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: HOST
        value: 0.0.0.0
