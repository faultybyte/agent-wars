services:
  - type: web
    name: autonomous-logistics-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python setup_db.py
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: HOST
        value: 0.0.0.0

